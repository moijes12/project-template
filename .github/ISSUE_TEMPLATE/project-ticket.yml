name: Project ticket
description: Propose a focused learning or implementation task.
title: ""
labels: []
body:
  - type: textarea
    id: what
    attributes:
      label: What
      description: What should be done, and why?
    validations:
      required: true
  - type: textarea
    id: hints
    attributes:
      label: Hints
      description: What useful context or starting points are known?
  - type: textarea
    id: pitfalls
    attributes:
      label: Pitfalls
      description: What risks, edge cases, or traps should be considered?
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How will completion be verified?
    validations:
      required: true
  - type: checkboxes
    id: stuck
    attributes:
      label: Stuck? (check this)
      options:
        - label: I am stuck and would like help.
