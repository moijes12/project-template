repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1024]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: bash -c 'if [ -d go ]; then find go -name "*.go" -type f -print0 | xargs -0 -r gofmt -w; fi'
        language: system
        pass_filenames: false
        always_run: true
      - id: go-vet
        name: go vet
        entry: bash -c 'if [ -d go ]; then cd go && go vet ./...; fi'
        language: system
        pass_filenames: false
        always_run: true
      - id: cargo-fmt
        name: cargo fmt
        entry: bash -c 'if [ -d rust ]; then cd rust && cargo fmt --all -- --check; fi'
        language: system
        pass_filenames: false
        always_run: true
      - id: cargo-clippy
        name: cargo clippy
        entry: bash -c 'if [ -d rust ]; then cd rust && cargo clippy --all-targets -- -D warnings; fi'
        language: system
        pass_filenames: false
        always_run: true
